<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nashir — README banner</title>
    <style>
      /* The 1280 x 640 banner at the top of the README. Colours are the extension's own
         tokens, so it stays in step with the app. */
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: Roboto, "IBM Plex Sans Arabic", sans-serif;
      }
      .banner {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 56px 72px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        overflow: hidden;
        background: rgb(var(--md-sys-color-surface));
        color: rgb(var(--md-sys-color-on-surface));
      }
      /* Flat shapes rather than gradients: they keep the PNG small and the edges clean. */
      .banner::before,
      .banner::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        z-index: 0;
      }
      .banner::before {
        width: 520px;
        height: 520px;
        left: -160px;
        top: -230px;
        background: rgb(var(--md-sys-color-primary-container) / 0.55);
      }
      .banner::after {
        width: 460px;
        height: 460px;
        right: -150px;
        bottom: -230px;
        background: rgb(var(--md-sys-color-tertiary-container) / 0.7);
      }
      .banner > * {
        position: relative;
        z-index: 1;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 132px;
        height: 132px;
        border-radius: 36px;
        background: rgb(var(--md-sys-color-surface-container-lowest));
        box-shadow: 0 10px 30px rgb(var(--md-sys-color-primary) / 0.18);
      }
      .mark img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .name {
        display: flex;
        align-items: baseline;
        gap: 36px;
        margin-top: 28px;
        font-size: 92px;
        font-weight: 700;
        line-height: 1;
        color: rgb(var(--md-sys-color-on-primary-container));
      }
      .name .divider {
        width: 3px;
        height: 64px;
        align-self: center;
        border-radius: 2px;
        background: rgb(var(--md-sys-color-primary) / 0.45);
      }
      .pitch {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 30px;
        font-size: 36px;
        font-weight: 500;
        line-height: 1.3;
        text-align: center;
      }
      .pitch p {
        margin: 0;
      }
      .tags {
        display: flex;
        gap: 14px;
        margin-top: auto;
      }
      .tags span {
        padding: 10px 22px;
        border-radius: 999px;
        font-size: 22px;
        font-weight: 500;
        background: rgb(var(--md-sys-color-secondary-container));
        color: rgb(var(--md-sys-color-on-secondary-container));
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="mark"><img src="/src/assets/logos/logo.png" alt="" /></div>
      <div class="name">
        <span>Nashir</span>
        <span class="divider"></span>
        <span lang="ar" dir="rtl">ناشِر</span>
      </div>
      <div class="pitch">
        <p class="en">Post to multiple Facebook groups, safely</p>
        <p class="ar" lang="ar" dir="rtl">انشر إلى مجموعات فيسبوك المتعددة بأمان</p>
      </div>
      <div class="tags">
        <span>Open source</span>
        <span>Runs on your device</span>
        <span lang="ar" dir="rtl">مفتوح المصدر</span>
        <span lang="ar" dir="rtl">يعمل على جهازك</span>
      </div>
    </div>
    <script type="module">
      import "/src/assets/fonts/fonts.css";
      import { fontsLoaded } from "/scripts/screenshots/fonts.js";
      import "/src/dashboard/tokens.css";
      await fontsLoaded();
      document.documentElement.dataset.ready = "1";
    </script>
  </body>
</html>
