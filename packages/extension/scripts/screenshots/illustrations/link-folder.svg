<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Link the folder</title>
  <desc id="d">The Nashir dashboard with the Link folder button highlighted and a folder picker choosing the Nashir folder.</desc>
  <style>
    text { font-family: Roboto, "Segoe UI", Arial, sans-serif; fill: #171d1a; }
    .muted { fill: #44504a; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#005140" flood-opacity="0.18" />
    </filter>
    <symbol id="folder" viewBox="0 0 48 40">
      <path d="M3 8a3 3 0 0 1 3-3h13l5 6h18a3 3 0 0 1 3 3v21a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="#a3f2d8" stroke="#116b56" stroke-width="2" stroke-linejoin="round" />
    </symbol>
  </defs>

  <rect width="800" height="500" fill="#f5fbf6" />
  <circle cx="60" cy="470" r="140" fill="#cee9dd" opacity="0.55" />
  <circle cx="760" cy="40" r="120" fill="#a3f2d8" opacity="0.4" />

  <!-- the dashboard window -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="420" rx="16" fill="#f5fbf6" stroke="#bfc9c3" stroke-width="2" />
    <path d="M66 40h104v420H66a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16z" fill="#e9efeb" />

    <!-- sidebar: mark and a few navigation pills -->
    <rect x="80" y="64" width="44" height="44" rx="12" fill="#a3f2d8" />
    <path d="M91 88l24-11-8 24-5-9z" fill="none" stroke="#116b56" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="68" y="130" width="92" height="30" rx="15" fill="#cee9dd" />
    <rect x="68" y="172" width="92" height="30" rx="15" fill="#e9efeb" stroke="#bfc9c3" stroke-width="1.5" />
    <rect x="68" y="214" width="92" height="30" rx="15" fill="#e9efeb" stroke="#bfc9c3" stroke-width="1.5" />
    <rect x="68" y="256" width="92" height="30" rx="15" fill="#e9efeb" stroke="#bfc9c3" stroke-width="1.5" />
    <text x="114" y="150" text-anchor="middle" font-size="14" font-weight="500" style="fill:#005140">Settings</text>

    <!-- the updates card -->
    <text x="200" y="88" font-size="24" font-weight="500">Settings</text>
    <rect x="200" y="106" width="520" height="164" rx="16" fill="#ffffff" stroke="#bfc9c3" stroke-width="2" />
    <text x="224" y="142" font-size="19" font-weight="700">Updates</text>
    <text x="224" y="180" font-size="16" class="muted">Installed</text>
    <text x="320" y="180" font-size="16" font-weight="500">1.0.0</text>
    <text x="224" y="230" font-size="16" class="muted">Folder</text>
    <rect x="320" y="210" width="124" height="30" rx="15" fill="#e9efeb" />
    <text x="382" y="231" text-anchor="middle" font-size="14" font-weight="500" class="muted">Not linked yet</text>
    <rect x="460" y="206" width="132" height="38" rx="19" fill="#ffffff" stroke="#116b56" stroke-width="2" />
    <text x="526" y="231" text-anchor="middle" font-size="16" font-weight="700" style="fill:#116b56">Link folder</text>

    <!-- a card behind the picker, left as plain shapes -->
    <rect x="200" y="290" width="150" height="140" rx="12" fill="#ffffff" stroke="#bfc9c3" stroke-width="2" />
    <rect x="218" y="310" width="90" height="12" rx="6" fill="#bfc9c3" />
    <rect x="218" y="336" width="112" height="10" rx="5" fill="#e9efeb" />
    <rect x="218" y="356" width="80" height="10" rx="5" fill="#e9efeb" />
  </g>

  <!-- step 1: the highlighted button -->
  <rect x="452" y="198" width="148" height="54" rx="27" fill="none" stroke="#f5a524" stroke-width="5" />
  <circle cx="452" cy="198" r="15" fill="#f5a524" />
  <text x="452" y="204" text-anchor="middle" font-size="17" font-weight="700" style="fill:#3a2400">1</text>

  <!-- step 2: the folder picker -->
  <g filter="url(#shadow)">
    <rect x="388" y="286" width="340" height="164" rx="16" fill="#ffffff" stroke="#bfc9c3" stroke-width="2" />
  </g>
  <text x="412" y="318" font-size="19" font-weight="700">Select folder</text>
  <rect x="404" y="330" width="308" height="36" rx="10" fill="#a3f2d8" stroke="#f5a524" stroke-width="4" />
  <use href="#folder" x="416" y="336" width="28" height="24" />
  <text x="456" y="355" font-size="18" font-weight="700" style="fill:#005140">Nashir</text>
  <use href="#folder" x="416" y="374" width="28" height="24" opacity="0.5" />
  <text x="456" y="393" font-size="18" class="muted">Photos</text>
  <rect x="572" y="404" width="140" height="34" rx="17" fill="#116b56" />
  <text x="642" y="427" text-anchor="middle" font-size="16" font-weight="500" style="fill:#ffffff">Select folder</text>
  <circle cx="388" cy="286" r="15" fill="#f5a524" />
  <text x="388" y="292" text-anchor="middle" font-size="17" font-weight="700" style="fill:#3a2400">2</text>
</svg>
