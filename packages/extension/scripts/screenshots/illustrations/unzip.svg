<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Unzip into Documents</title>
  <desc id="d">A zip file is extracted into a folder named Nashir inside Documents.</desc>
  <style>
    text { font-family: Roboto, "Segoe UI", Arial, sans-serif; fill: #171d1a; }
    .muted { fill: #44504a; }
    .card { fill: #ffffff; stroke: #bfc9c3; stroke-width: 2; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#005140" flood-opacity="0.16" />
    </filter>
    <symbol id="file" viewBox="0 0 40 48">
      <path d="M4 2h22l10 10v32a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#ffffff" stroke="#6f7975" stroke-width="2" stroke-linejoin="round" />
      <path d="M26 2v10h10" fill="none" stroke="#6f7975" stroke-width="2" stroke-linejoin="round" />
      <path d="M10 24h20M10 31h20M10 38h12" stroke="#bfc9c3" stroke-width="2.5" stroke-linecap="round" />
    </symbol>
    <symbol id="folder" viewBox="0 0 48 40">
      <path d="M3 8a3 3 0 0 1 3-3h13l5 6h18a3 3 0 0 1 3 3v21a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="#a3f2d8" stroke="#116b56" stroke-width="2" stroke-linejoin="round" />
    </symbol>
  </defs>

  <rect width="800" height="500" fill="#f5fbf6" />
  <circle cx="90" cy="440" r="150" fill="#cee9dd" opacity="0.55" />
  <circle cx="730" cy="60" r="120" fill="#a3f2d8" opacity="0.4" />

  <!-- the zip file -->
  <g filter="url(#shadow)">
    <path class="card" d="M80 130h122l56 56v196a10 10 0 0 1-10 10H80a10 10 0 0 1-10-10V140a10 10 0 0 1 10-10z" stroke-linejoin="round" />
    <path d="M202 130v56h56" fill="#e9efeb" stroke="#bfc9c3" stroke-width="2" stroke-linejoin="round" />
    <g fill="#116b56">
      <rect x="150" y="150" width="14" height="10" rx="2" />
      <rect x="164" y="160" width="14" height="10" rx="2" fill="#6f7975" />
      <rect x="150" y="170" width="14" height="10" rx="2" />
      <rect x="164" y="180" width="14" height="10" rx="2" fill="#6f7975" />
      <rect x="150" y="190" width="14" height="10" rx="2" />
      <rect x="164" y="200" width="14" height="10" rx="2" fill="#6f7975" />
    </g>
    <rect x="144" y="212" width="40" height="54" rx="8" fill="#116b56" />
    <rect x="154" y="228" width="20" height="24" rx="5" fill="#a3f2d8" />
    <text x="164" y="326" text-anchor="middle" font-size="24" font-weight="700">ZIP</text>
  </g>
  <text x="164" y="420" text-anchor="middle" font-size="20" font-weight="500">nashir-1.0.0.zip</text>

  <!-- the arrow -->
  <g>
    <path d="M290 262h96" stroke="#116b56" stroke-width="8" stroke-linecap="round" />
    <path d="M362 234l30 28-30 28" fill="none" stroke="#116b56" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="338" y="214" text-anchor="middle" font-size="22" font-weight="700" style="fill:#116b56">Extract</text>
  </g>

  <!-- the folder window -->
  <g filter="url(#shadow)">
    <rect class="card" x="430" y="100" width="320" height="310" rx="16" />
    <path d="M430 116a16 16 0 0 1 16-16h288a16 16 0 0 1 16 16v34H430z" fill="#e9efeb" />
    <circle cx="456" cy="125" r="6" fill="#bfc9c3" />
    <circle cx="476" cy="125" r="6" fill="#bfc9c3" />
    <circle cx="496" cy="125" r="6" fill="#bfc9c3" />
    <rect x="450" y="162" width="280" height="36" rx="18" fill="#f5fbf6" stroke="#bfc9c3" stroke-width="2" />
    <use href="#folder" x="462" y="170" width="24" height="20" />
    <text x="496" y="186" font-size="18" font-weight="500">Documents › <tspan font-weight="700" style="fill:#116b56">Nashir</tspan></text>

    <use href="#file" x="460" y="226" width="40" height="48" />
    <text x="480" y="294" text-anchor="middle" font-size="13" class="muted">manifest.json</text>
    <use href="#folder" x="560" y="230" width="48" height="40" />
    <text x="584" y="294" text-anchor="middle" font-size="13" class="muted">assets</text>
    <use href="#folder" x="660" y="230" width="48" height="40" />
    <text x="684" y="294" text-anchor="middle" font-size="13" class="muted">dashboard</text>
    <use href="#file" x="460" y="320" width="40" height="48" />
    <text x="480" y="388" text-anchor="middle" font-size="13" class="muted">nashir-files.json</text>
    <use href="#folder" x="560" y="324" width="48" height="40" />
    <text x="584" y="388" text-anchor="middle" font-size="13" class="muted">src</text>
  </g>
  <text x="590" y="446" text-anchor="middle" font-size="20" font-weight="500">Documents › Nashir</text>
</svg>
