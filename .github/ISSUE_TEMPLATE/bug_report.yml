name: Bug report
description: Something in Nashir does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If a single Facebook operation stopped working, use the "Broken operation" form instead.
        Do not paste cookies, tokens, HAR files or other people's personal information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nashir version
      description: Shown on the extensions page of Chrome.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and operating system
      placeholder: "Chrome 130 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the Logs page, with anything personal removed.
      render: text
